<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu</title>
    <link rel="stylesheet" href="style-menu.css" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
  </head>
  <body>
    <div class="main-page">
      <div class="header">
        <img src="logo.svg" alt="logo" class="logo" />
        <nav class="nav">
          <ul class="nav-list">
            <li><a href="#favoriate">Favorite coffee</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#app">Mobile app</a></li>
            <li><a href="#contacts">Contact us</a></li>
          </ul>
        </nav>
        <div class="header-right">
          <div class="theme-toggle">
            <button class="theme-btn theme-btn--active">
              <img src="Sun.svg" alt="light theme" class="light-theme-img" />
            </button>
            <button class="theme-btn">
              <img src="Moon.svg" alt="dark theme" />
            </button>
          </div>
          <div class="menu-item">
            <p class="menu-text">Menu</p>
            <img src="coffee-cup.svg" alt="сoffee cup" class="coffee-cup" />
          </div>
        </div>
      </div>
      <section class="menu-page">
        <h2>Behind each of our cups hides an <span>amazing surprise</span></h2>

        <div class="filter-buttons">
          <button class="filter-btn filter-btn--active">
            <span class="filter-icon-wrap">☕</span>
            Coffee
          </button>
          <button class="filter-btn">
            <span class="filter-icon-wrap">🍵</span>
            Tea
          </button>
          <button class="filter-btn">
            <span class="filter-icon-wrap">🍰</span>
            Dessert
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
